name = "legal-change-letter"
main = "index.js"
compatibility_date = "2026-10-09"

# D1は新規作成後に設定する。HOJO-LETTER本番DBを指定しないこと。
[[d1_databases]]
binding = "DB"
database_name = "legal-change-letter"
database_id = "REPLACE_WITH_NEW_DATABASE_ID"

[triggers]
# 毎日 UTC 03:20（日本時間 12:20）に更新法令を確認
crons = ["20 3 * * *"]
