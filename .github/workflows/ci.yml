name: CI
on:
  push:
    branches: ["main", "mvp/scaffold-2026-10", "fix/security-queue-2026-10"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/index.js
      - run: node --check src/sources.js
      - run: node --check src/email.js
      - run: npm test
