name: CI
on:
  push:
    branches: ["main", "mvp/scaffold-2026-10", "fix/security-queue-2026-10"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/index.js
      - run: node --check src/sources.js
      - run: node --check src/egov.js
      - run: node --check src/attribution.js
      - run: node --check src/email.js
      - run: npm test
      - name: Validate fresh SQLite schema and seed data
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.executescript(Path("schema.sql").read_text(encoding="utf-8"))
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {"subscribers", "sources", "delivery_queue", "system_locks"}
          assert required <= tables, f"Missing tables: {required - tables}"
          source_ids = {row[0] for row in db.execute("SELECT id FROM sources")}
          assert {"digital_rss", "egov_law_api"} <= source_ids, f"Missing sources: {source_ids}"
          role_ids = {row[0] for row in db.execute("SELECT id FROM roles")}
          assert "individual" in role_ids, f"Missing seeded roles: {role_ids}"
          print("Fresh schema applied; required tables and seed rows verified.")
          PY
